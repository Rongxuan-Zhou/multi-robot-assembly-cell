# ================================================================
# OP08#-1 — Robot R2 Configuration (ROKAE XB7L)
# Role: Main assembly — motor + motor mounting body + 4 screws (M2.5x4 for #8, M2.5x6 for #11&#18)
# 6-axis ROKAE per source; XB7L is a representative model
# ================================================================

robot:
  id: R2_ROKAE
  brand: ROKAE
  model: XB7L
  serial_number: RK-2024-R2-0142
  role: main_assembly

specifications:
  dof: 6
  payload_kg: 7.0
  reach_mm: 906.0
  repeatability_mm: 0.03
  max_speed_deg_s: [180, 180, 180, 360, 360, 360]
  weight_kg: 50.0                  # approx., XB7-class; not from the deck
  ip_rating: IP54
  force_torque_sensor: integrated    # optional add-on

communication:
  ip_address: 192.168.1.12
  subnet_mask: 255.255.255.0
  gateway: 192.168.1.1
  protocol: ROKAE_SDK
  port: 20000
  timeout_ms: 3000
  heartbeat_interval_ms: 200

tools:
  gripper:
    type: electric_parallel
    stroke_mm: 15.0
    force_n: 25.0
    open_time_ms: 120
    close_time_ms: 160
    tcp_offset: [0.0, 0.0, 155.0, 0.0, 0.0, 0.0]
  screwdriver:
    type: electric_spindle
    max_torque_nm: 2.0
    max_speed_rpm: 1000
    bit_type: HEX1.5    # hex socket countersunk M2.5 — 1.5 mm hex key
    tcp_offset: [0.0, 0.0, 180.0, 0.0, 0.0, 0.0]

screw_profile_by_variant:   # source page I / VI: motor-mount screw differs per variant
  ACT_8: M2.5x4
  ACT_11: M2.5x6
  ACT_18: M2.5x6
screw_count_per_cycle: 4
screw_feeder_ids: [feeder_1, feeder_2]  # feeder 1 = M2.5x4 (#8), feeder 2 = M2.5x6 (#11&#18); assignment inferred

home_position:
  joints_deg: [0.0, -45.0, 0.0, 0.0, -45.0, 0.0]

speed_profiles:
  fast:
    joint_speed_pct: 70
    linear_speed_mm_s: 400
  normal:
    joint_speed_pct: 40
    linear_speed_mm_s: 200
  slow:
    joint_speed_pct: 15
    linear_speed_mm_s: 30
  screw_approach:
    joint_speed_pct: 5
    linear_speed_mm_s: 10

work_objects:
  turntable_zone2:
    frame: [200.0, -300.0, 750.0, 0.0, 0.0, 0.0]
  screw_feeder:
    frame: [500.0, -500.0, 850.0, 0.0, 0.0, 0.0]

# Source sequence steps 5-11 and 17 (page II). Durations are estimates.
assembly_sequence:
  - step: pick_motor
    description: Pick motor from turntable transfer fixture to workbench fixture
    duration_ms: 10000
  - step: cable_dressing
    description: Auxiliary cable-dressing fixture arranges motor cables
    duration_ms: 8000
  - step: mount_body
    description: Pick motor mounting body and lower onto motor; cable-dressing fixture retracts
    duration_ms: 12000
    force_control: true
    force_limit_n: 8.0
  - step: clamp
    description: Clamping fixture clamps motor / mounting body
    duration_ms: 4000
  - step: screw_1
    description: "motor-mount screw #1 (M2.5x4 #8 / M2.5x6 #11&#18)"
    duration_ms: 9000
  - step: screw_2
    description: "motor-mount screw #2 (M2.5x4 #8 / M2.5x6 #11&#18)"
    duration_ms: 9000
  - step: screw_3
    description: "motor-mount screw #3 (M2.5x4 #8 / M2.5x6 #11&#18)"
    duration_ms: 9000
  - step: screw_4
    description: "motor-mount screw #4 (M2.5x4 #8 / M2.5x6 #11&#18)"
    duration_ms: 9000
  - step: unclamp
    description: Clamping fixture releases the assembled product
    duration_ms: 4000
  - step: return_to_turntable
    description: Transfer assembled product from workbench fixture to turntable Station 3 fixture
    duration_ms: 10000
    # executed after Zone 3 completes (source step 17)

safety:
  zone: ZONE2
  max_speed_mm_s: 250.0
  collision_detection_threshold_nm: 8.0
  force_control_enabled: true
